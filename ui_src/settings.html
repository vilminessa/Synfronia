<!-- Оверлей настроек внутри главного окна (фрагмент страницы, без обвязки
     документа). Разметку разделов и полей рисует settings.js по схеме
     settings_schema.py, поэтому тема не может её переопределить.
     Вставляется в главную страницу плейсхолдером SETTINGS_HTML;
     если тема со своим entry этого плейсхолдера не содержит,
     themes.build_page дописывает фрагмент сам (themes._ensure_settings). -->
<div id="settings-overlay" class="settings-overlay" hidden>
  <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="win-head">
      <span class="win-title" id="settings-title" data-i18n="ui.settings">Настройки</span>
      <button type="button" id="settings-close" class="icon-btn" data-i18n-aria="ui.close" aria-label="Закрыть">&#x2715;&#xFE0E;</button>
    </header>
    <div class="win-body">
      <nav class="nav" id="settings-nav"></nav>
      <main class="section" id="settings-sections"></main>
    </div>
  </div>
</div>
