<!-- Оверлей настроек внутри главного окна (фрагмент страницы, без обвязки
     документа). Разметку разделов, карточек и полей рисует Alpine (x-for по
     схеме settings_schema.py через settingsPanel в settings.js), поэтому
     тема не может её переопределить; оболочка оверлея (hidden, inert,
     фокус-ловушка) остаётся нативной - её ведёт app.js.
     Вставляется в главную страницу плейсхолдером SETTINGS_HTML;
     если тема со своим entry этого плейсхолдера не содержит,
     themes.build_page дописывает фрагмент сам (themes._ensure_settings). -->
<div id="settings-overlay" class="settings-overlay" hidden>
  <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="win-head u-flex u-items-center u-justify-between u-gap-12">
      <span class="win-title" id="settings-title" data-i18n="ui.settings">Настройки</span>
      <button type="button" id="settings-close" class="icon-btn icon-btn-sm" data-i18n-aria="ui.close" aria-label="Закрыть">&#x2715;&#xFE0E;</button>
    </header>
    <div class="win-body u-flex" x-data="settingsPanel()">
      <nav class="nav u-flex-col u-gap-4" id="settings-nav">
        <template x-for="(group, gi) in groups" :key="group.id">
          <button type="button" class="nav-item" :class="gi ? null : 'active'"
                  :id="'nav-' + group.id" @click="switchSection(group.id)">
            <span :data-i18n="group.label" x-text="t(group.label)"></span>
          </button>
        </template>
      </nav>
      <main class="section u-flex-col u-gap-12" id="settings-sections">
        <template x-for="(group, gi) in groups" :key="group.id">
          <div role="tabpanel" :id="'section-' + group.id" :hidden="gi > 0">
            <template x-for="card in group.layout" :key="card.key">
              <div class="field-card" x-mount-card="card">
                <template x-if="card.title">
                  <span class="field-card-title" :data-i18n="card.title"
                        x-text="t(card.title)"></span>
                </template>
                <div class="field-card-body">
                  <template x-for="blk in card.blocks" :key="blk.key">
                    <div x-mount-block="blk"></div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </main>
    </div>
  </div>

  <!-- Диалог «Выберите обход»: список установок, пополнение реестра и
       загрузка версий. Лежит внутри того же оверлея, что и карточка, -
       app.js ведёт его как часть настроек (hidden/inert остаются как были). -->
  <div id="bypass-dialog" class="bypass-dialog" hidden role="dialog"
       aria-modal="true" aria-labelledby="bypass-dialog-title">
    <header class="win-head u-flex u-items-center u-justify-between u-gap-12">
      <span class="win-title" id="bypass-dialog-title"
            data-i18n="sheet.dpi.dialog.title">Выберите обход</span>
      <button type="button" id="bypass-dialog-close" class="icon-btn icon-btn-sm"
              data-i18n-aria="ui.close" aria-label="Закрыть">&#x2715;&#xFE0E;</button>
    </header>
    <div class="bypass-dialog-body u-flex-col u-gap-12">
      <div class="bypass-dialog-sub" data-i18n="sheet.dpi.dialog.install">Установки</div>
      <ul id="bypass-install-list" class="bypass-list u-flex-col u-gap-6"></ul>
      <div class="bypass-dialog-row u-flex u-wrap u-gap-8">
        <button type="button" id="bypass-dialog-add" class="btn btn-outline btn-sm" data-i18n="sheet.dpi.add">Добавить папку…</button>
        <button type="button" id="bypass-dialog-detect" class="btn btn-outline btn-sm" data-i18n="sheet.dpi.detect">Найти установленные</button>
        <button type="button" id="bypass-dialog-remove" class="btn btn-outline btn-sm" data-i18n="sheet.dpi.remove">Убрать из списка</button>
      </div>
      <!-- Стратегии активной установки: выбор здесь же, а не только текстом
           в панели - пользователь должен видеть, сколько их доступно -->
      <div class="bypass-dialog-sub" data-i18n="sheet.dpi.dialog.strategies">Стратегии активной установки</div>
      <ul id="bypass-strategy-list" class="bypass-list u-flex-col u-gap-6 bypass-strategies"></ul>
      <div class="bypass-dialog-dl">
        <div class="bypass-dialog-sub" data-i18n="sheet.dpi.dialog.download">Скачать версию</div>
        <div id="bypass-repo-row" class="bypass-repo-row u-flex u-wrap u-gap-8"></div>
        <ul id="bypass-release-list" class="bypass-list u-flex-col u-gap-6"></ul>
        <div id="bypass-download-note" class="note"></div>
      </div>
    </div>
    <footer class="bypass-dialog-foot u-flex u-justify-end u-gap-8">
      <button type="button" id="bypass-dialog-done" class="btn btn-primary btn-sm"
              data-i18n="sheet.dpi.dialog.done">Готово</button>
    </footer>
  </div>
</div>
