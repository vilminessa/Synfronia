<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Synfronia</title>
<style>
  :root {
    --bg: #0c1622; --surface: #1f2b29; --widget: #23444b;
    --text: #dcdedd; --accent: #628d7c; --warn: #ffb454;
    --radius-s: 6px; --radius-m: 8px; --radius-l: 12px; --opacity: 1;
  }
  :root { __THEME_ROOT__ }
</style>
<style id="fonts-style">__FONTS_CSS__</style>
<style id="theme-style">__THEME_CSS__</style>
<style>
__APP_CSS__
</style>
<style>
__MAIN_CSS__
</style>
</head>
<body>

<!-- SLOT:head -->
<div class="head">
    <div class="brand">
      <h1 class="logo">Synfronia</h1>
      <div class="sub" data-i18n="ui.sub">Скачивание видео и плейлистов YouTube (yt-dlp)</div>
    </div>
    <button type="button" id="settings-btn" class="icon-btn" data-i18n-title="ui.settings" title="Настройки">&#x2699;&#xFE0E;</button>
  </div>
<!-- /SLOT:head -->


  
<!-- SLOT:tabs -->
<div class="tabs">
    <button type="button" id="tab-video" class="tab active" data-i18n="tab.video">Видео</button>
    <button type="button" id="tab-playlist" class="tab" data-i18n="tab.playlist">Плейлист</button>
  </div>
<!-- /SLOT:tabs -->


  
<!-- SLOT:panel-video -->
<div id="panel-video" class="panel">
    <label for="url-video" data-i18n="url.video.label">Ссылка на видео:</label>
    <input type="text" id="url-video" placeholder="https://www.youtube.com/watch?v=…" autofocus>
  </div>
<!-- /SLOT:panel-video -->


  
<!-- SLOT:panel-playlist -->
<div id="panel-playlist" class="panel" hidden>
    <label for="url-playlist" data-i18n="url.playlist.label">Ссылка на плейлист:</label>
    <input type="text" id="url-playlist" placeholder="https://www.youtube.com/playlist?list=…">
    <div class="check"><input type="checkbox" id="group"><span data-i18n="group.label">Сгруппировать: плейлист в подпапку с его названием</span></div>
  </div>
<!-- /SLOT:panel-playlist -->


  
<!-- SLOT:warn -->
<div id="warn" data-i18n="warn.ffmpeg">ffmpeg не найден — слияние, субтитры, метаданные и перекодировка будут недоступны.</div>
<!-- /SLOT:warn -->


  
<!-- SLOT:ffmpeg-overlay -->
<div id="ffmpeg-overlay" class="ffmpeg-hidden">
    <div id="ffmpeg-rain"></div>
    <div id="ffmpeg-box">
      <div id="ffmpeg-head">
        <div id="ffmpeg-title">Synfronia</div>
        <div id="ffmpeg-sub" data-i18n="ffmpeg.overlay_hint">Для слияния видео и аудио, субтитров, метаданных и перекодировки нужен ffmpeg.</div>
      </div>
      <div style="position:relative;display:inline-block">
        <button type="button" id="ffmpeg-dl">
          <span data-i18n="ffmpeg.download">Загрузить FFmpeg</span>
          <canvas width="640" height="148"></canvas>
        </button>
        <div id="ffmpeg-progress" class="ffmpeg-hidden">
          <svg id="ffmpeg-ring" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fg" cx="60" cy="60" r="52"></circle>
          </svg>
          <div id="ffmpeg-percent">0%</div>
        </div>
      </div>
      <div id="ffmpeg-status"></div>
      <button type="button" id="ffmpeg-retry" data-i18n="ffmpeg.download">Загрузить FFmpeg</button>
    </div>
  </div>
<!-- /SLOT:ffmpeg-overlay -->


  
<!-- SLOT:actions -->
<div class="actions">
    <button id="download" class="dl" type="button">
      <span class="dl-fill"></span>
      <span class="dl-label" data-i18n="btn.download">Скачать</span>
      <span class="dl-pct"></span>
      <span class="dl-icon" aria-hidden="true"></span>
    </button>
    <button id="stop" disabled data-i18n="btn.stop">Отмена</button>
  </div>
<!-- /SLOT:actions -->


  
<!-- SLOT:progress -->
<div class="pb-wrap"><div id="pb"></div></div>
  <div id="status">Готов.</div>
  <textarea id="log" readonly></textarea>
<!-- /SLOT:progress -->

  
<!-- SLOT:clicker -->
<div class="clicker-row">
    <div id="clicker-msg" class="clicker-msg"></div>
    <button type="button" id="clicker" class="clicker" data-i18n-title="clicker.title" title="…">Кликни меня~</button>
  </div>
<!-- /SLOT:clicker -->


  
<!-- SLOT:modal -->
<div id="settings-block" class="overlay" hidden></div>
<!-- /SLOT:modal -->


  
<script>__COMMONJS__</script>
<script>__APPJS__</script>
</body>
</html>
